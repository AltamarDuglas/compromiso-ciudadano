<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Metadatos de codificación y visualización responsiva Mobile-First -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0F1E4A" />
  
  <!-- SEO: Título descriptivo y meta descripción atractiva -->
  <title>TODOS Somos Montería | ¡Vivamos Bonito! - Pacto Ciudadano</title>
  <meta name="description" content="Únete al movimiento cívico TODOS Somos Montería - ¡Vivamos Bonito! Sella tu compromiso por una ciudad limpia, verde y orgullosa del Río Sinú y obtén tu credencial holográfica de Guardián oficial." />
  <meta name="keywords" content="Monteria, Vivamos Bonito, Rio Sinu, Pacto Ciudadano, Sostenibilidad, Limpieza, Cultura Ciudadana, Cordoba Colombia" />

  <!-- Metadatos Open Graph para compartir en WhatsApp, Facebook y Twitter con vista previa impecable -->
  <meta property="og:title" content="TODOS Somos Montería | ¡Vivamos Bonito!" />
  <meta property="og:description" content="Firma tu compromiso cívico y recibe tu credencial oficial de Guardián de Montería." />
  <meta property="og:type" content="website" />

  <!-- Tipografías de Google Fonts: 'Plus Jakarta Sans' y 'Outfit' (Bold Display) y 'Caveat' (Acento Cursivo Dinámico) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Favicon estilizado con la estrella dorada vectorial oficial (sin emojis) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23f59e0b'><polygon points='12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2'/></svg>" />
</head>
<body>
  <!-- Contenedor raíz donde React monta la aplicación -->
  <div id="root"></div>

  <!-- Script principal de inicio de la aplicación en React -->
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
